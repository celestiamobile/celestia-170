name: Build Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'

jobs:
  build-installer:
    name: "installer-${{matrix.platform}}"
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            os: windows-latest
          - platform: x86
            os: windows-latest
          - platform: arm64
            os: windows-11-arm

    steps:
    - name: Checkout installer repo
      uses: actions/checkout@v6

    - name: Checkout Celestia source
      uses: actions/checkout@v6
      with:
        repository: CelestiaProject/Celestia
        path: 'celestia'
        submodules: true

    - name: Checkout CelestiaContent
      uses: actions/checkout@v6
      with:
        repository: CelestiaProject/CelestiaContent
        path: 'content'

    - name: Update vcpkg
      shell: pwsh
      run: |
        $vcpkgCommit = 'c3867e714dd3a51c272826eea77267876517ed99'
        pushd "$env:VCPKG_INSTALLATION_ROOT"
        git fetch origin $vcpkgCommit
        git reset --hard $vcpkgCommit
        ./bootstrap-vcpkg.bat
        ./vcpkg.exe integrate install
        popd

    - name: Setup NuGet Credentials
      shell: pwsh
      run: |
        $nugetCmd = vcpkg fetch nuget | Select-Object -Last 1
        $nugetSource = 'https://nuget.pkg.github.com/CelestiaProject/index.json'
        & "$nugetCmd" sources add `
          -Source "$nugetSource" `
          -StorePasswordInClearText `
          -Name "GitHub" `
          -Username 'CelestiaProject' `
          -Password '${{secrets.GITHUB_TOKEN}}'

    - name: Find ImageMagick
      shell: pwsh
      run: |
        $magickDir = $null
        if ('${{matrix.platform}}' -eq 'arm64') {
          # System ImageMagick on windows-11-arm is x64; download the ARM64 portable build directly
          $releasePage = Invoke-WebRequest -Uri 'https://imagemagick.org/archive/binaries/' -UseBasicParsing
          $arm7z = ($releasePage.Links | Where-Object { $_.href -match 'portable-Q16-HDRI-arm64\.7z$' } | Select-Object -Last 1).href
          if (-not $arm7z) { Write-Error "Could not find ARM64 ImageMagick portable archive"; exit 1 }
          $archiveUrl = "https://imagemagick.org/archive/binaries/$arm7z"
          $extractPath = "$env:TEMP\ImageMagick-arm64"
          Write-Host "Downloading $archiveUrl"
          Invoke-WebRequest -Uri $archiveUrl -OutFile "$env:TEMP\imagemagick-arm64.7z"
          & 'C:\Program Files\7-Zip\7z.exe' x "$env:TEMP\imagemagick-arm64.7z" -o"$extractPath" -y
          $magickDir = $extractPath
        } else {
          # Search common install locations
          foreach ($root in @("C:\Program Files", "C:\Program Files (x86)", "C:\Tools", "C:\ProgramData\chocolatey\lib")) {
            $found = Get-ChildItem "$root\ImageMagick*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $magickDir = $found.FullName; break }
          }
          # Fallback: find magick.exe anywhere via choco shim or PATH
          if (-not $magickDir) {
            $magickExe = (Get-Command magick -ErrorAction SilentlyContinue).Source
            if ($magickExe) { $magickDir = Split-Path $magickExe }
          }
          if (-not $magickDir) {
            Write-Host "ImageMagick not found, installing..."
            choco install imagemagick -y
            refreshenv
            $magickExe = (Get-Command magick -ErrorAction SilentlyContinue).Source
            if ($magickExe) { $magickDir = Split-Path $magickExe }
          }
        }
        Write-Host "ImageMagick dir: $magickDir"
        if ($magickDir) {
          echo "$magickDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "ImageMagick_HOME=$magickDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Error "Failed to locate ImageMagick"; exit 1
        }

    - name: Install dependencies
      shell: pwsh
      run: |
        $packages = @(
          'boost-container',
          'boost-container-hash',
          'boost-smart-ptr',
          'eigen3',
          'ffmpeg[core,avcodec,avformat,gpl,swscale,x264]',
          'fmt',
          'freetype',
          'gettext[tools]',
          'gperf',
          'libepoxy',
          'libjpeg-turbo',
          'libpng',
          'luajit',
          'qtbase[core,opengl,widgets,freetype,harfbuzz,jpeg,png]'
        )

        if ( '${{matrix.platform}}' -eq 'x86' ) {
          $hostTriplet = 'x86-windows-release'
          $targetTriplet = 'x86-windows-release'
        } elseif ( '${{matrix.platform}}' -eq 'arm64' ) {
          $hostTriplet = 'arm64-windows'
          $targetTriplet = 'arm64-windows'
        } else {
          $hostTriplet = 'x64-windows-release'
          $targetTriplet = 'x64-windows-release'
        }

        pushd "$env:VCPKG_INSTALLATION_ROOT"
        ./vcpkg.exe --overlay-triplets=${{github.workspace}}/celestia/windows/vcpkg-triplets `
                    --triplet="$targetTriplet" `
                    --host-triplet="$hostTriplet" `
                    install --recurse @packages
        popd

    - name: Configure CMake
      shell: pwsh
      run: |
        if ( '${{matrix.platform}}' -eq 'x86' ) {
            $GeneratorPlatform = 'Win32'
            $vcpkgTriplet = 'x86-windows-release'
        } elseif ( '${{matrix.platform}}' -eq 'arm64' ) {
            $GeneratorPlatform = 'ARM64'
            $vcpkgTriplet = 'arm64-windows'
        } else {
            $GeneratorPlatform = '${{matrix.platform}}'
            $vcpkgTriplet = 'x64-windows-release'
        }

        cmake -B '${{github.workspace}}/build' `
            -S '${{github.workspace}}/celestia' `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="${{github.workspace}}/celestia/windows/vcpkg-triplets" `
            -DVCPKG_TARGET_TRIPLET="$vcpkgTriplet" `
            -DCMAKE_GENERATOR_PLATFORM="$GeneratorPlatform" `
            -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install" `
            -DENABLE_SPICE=OFF    `
            -DENABLE_TOOLS=ON     `
            -DENABLE_TESTS=ON     `
            -DENABLE_SDL=OFF      `
            -DENABLE_QT5=OFF      `
            -DENABLE_WIN=ON       `
            -DENABLE_QT6=ON       `
            -DENABLE_FFMPEG=ON    `
            -DENABLE_MINIAUDIO=ON `
            -DENABLE_LTO=ON       `
            -DUSE_ICU=ON          `
            -DUSE_WIN_ICU=ON

    - name: Build
      shell: pwsh
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} '--' /maxcpucount:2 /nologo

    - name: Test
      shell: pwsh
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Prepare installer directory
      shell: pwsh
      run: |
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --component core
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --component wingui
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --component qt6gui
        Rename-Item -Path "install" -NewName "installer"

    - name: Install CelestiaContent
      shell: pwsh
      run: |
        if ( '${{matrix.platform}}' -eq 'arm64' ) {
          $contentTriplet = 'arm64-windows'
        } elseif ( '${{matrix.platform}}' -eq 'x86' ) {
          $contentTriplet = 'x86-windows-release'
        } else {
          $contentTriplet = 'x64-windows-release'
        }

        cmake -S ${{github.workspace}}/content -B ${{github.workspace}}/content/build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="${{github.workspace}}/celestia/windows/vcpkg-triplets" `
            -DVCPKG_TARGET_TRIPLET="$contentTriplet" `
            -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/installer `
            -DImageMagick_magick_EXECUTABLE="$env:ImageMagick_HOME/magick.exe" `
            -DImageMagick_convert_EXECUTABLE="$env:ImageMagick_HOME/magick.exe" `
            -DImageMagick_identify_EXECUTABLE="$env:ImageMagick_HOME/magick.exe"
        cmake --build ${{github.workspace}}/content/build --config ${{env.BUILD_TYPE}} --target install

    - name: Copy files for installer
      shell: pwsh
      run: |
        Copy-Item celestia.iss ${{github.workspace}}/installer/
        Copy-Item ${{github.workspace}}/celestia/win32-installer-image.bmp ${{github.workspace}}/installer/
        Copy-Item ${{github.workspace}}/celestia/AUTHORS ${{github.workspace}}/installer/
        Copy-Item ${{github.workspace}}/celestia/ChangeLog ${{github.workspace}}/installer/
        Copy-Item ${{github.workspace}}/celestia/README ${{github.workspace}}/installer/
        Copy-Item ${{github.workspace}}/celestia/TRANSLATORS ${{github.workspace}}/installer/

    - name: Run windeployqt for installer
      shell: pwsh
      run: |
        if ( '${{matrix.platform}}' -eq 'arm64' ) {
          $tripletDir = 'arm64-windows'
        } elseif ( '${{matrix.platform}}' -eq 'x86' ) {
          $tripletDir = 'x86-windows-release'
        } else {
          $tripletDir = 'x64-windows-release'
        }
        $windeployqt = "$env:VCPKG_INSTALLATION_ROOT/installed/$tripletDir/tools/Qt6/bin/windeployqt.exe"
        & $windeployqt "${{github.workspace}}/installer/celestia-qt6.exe"

    - name: Download VC++ redistributable
      shell: pwsh
      run: |
        if ('${{matrix.platform}}' -eq 'x86') {
          $url = 'https://aka.ms/vc14/vc_redist.x86.exe'
        } elseif ('${{matrix.platform}}' -eq 'arm64') {
          $url = 'https://aka.ms/vc14/vc_redist.arm64.exe'
        } else {
          $url = 'https://aka.ms/vc14/vc_redist.x64.exe'
        }
        Invoke-WebRequest -Uri $url -OutFile "${{github.workspace}}/installer/vc_redist.exe"

    - name: Create installer
      shell: cmd
      run: |
        set ISCCExtraFlags=/DBuildX64Installer
        if ${{matrix.platform}}==x86 set ISCCExtraFlags=/DBuildX86Installer
        if ${{matrix.platform}}==arm64 set ISCCExtraFlags=/DBuildArm64Installer
        iscc ${{github.workspace}}\installer\celestia.iss /O${{github.workspace}}\installer /FCelestiaInstaller %ISCCExtraFlags%

    - name: Rename installer
      shell: pwsh
      run: |
        Rename-Item -Path "${{github.workspace}}/installer/CelestiaInstaller.exe" `
                    -NewName "CelestiaInstaller-${{matrix.platform}}.exe"

    - name: Upload installer
      uses: actions/upload-artifact@v5
      if: success()
      with:
        name: celestia-installer-${{matrix.platform}}
        if-no-files-found: error
        path: |
          ${{github.workspace}}/installer/CelestiaInstaller-${{matrix.platform}}.exe

  release:
    name: "Create Release"
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all installer artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: Delete existing latest release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true

    - name: Create rolling prerelease
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create latest \
          --repo ${{ github.repository }} \
          --title "Latest Build" \
          --notes "Rolling pre-release built from CelestiaProject/Celestia master.

        Built on $(date -u '+%Y-%m-%d %H:%M UTC')
        Celestia commit: $(cd artifacts && echo 'see workflow run for details')" \
          --prerelease \
          artifacts/celestia-installer-x64/CelestiaInstaller-x64.exe \
          artifacts/celestia-installer-x86/CelestiaInstaller-x86.exe \
          artifacts/celestia-installer-arm64/CelestiaInstaller-arm64.exe
